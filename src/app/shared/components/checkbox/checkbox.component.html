<div class="checkbox-item" [class.checked]="checked" [class]="cssClass" [attr.aria-disabled]="disabled">
  <div class="checkbox-label" [class]="justify ? 'ion-justify-content-' + justify : ''">
    {{ label }}
  </div>
   <ion-checkbox
    class="native-checkbox"
    [checked]="control?.value ?? checked"
    [disabled]="disabled"
    [indeterminate]="indeterminate"
    [value]="value"
    [name]="name"
    (ionChange)="onChange($event)">
  </ion-checkbox>
</div>
