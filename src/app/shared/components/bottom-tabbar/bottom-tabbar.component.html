<ion-footer class="bottom-tabbar" translucent>
  <ion-toolbar>
    <ion-grid>
      <ion-row>
        <ion-col *ngFor="let t of tabs" [size]="colSize">
          <ion-button class="tab-btn" fill="clear" expand="full" (click)="onClick(t)" [attr.aria-label]="t.aria || ''">
            <ion-icon [name]="t.icon"></ion-icon>
          </ion-button>
        </ion-col>
      </ion-row>
    </ion-grid>
  </ion-toolbar>
</ion-footer>
