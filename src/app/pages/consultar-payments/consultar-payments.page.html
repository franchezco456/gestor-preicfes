<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/home"></ion-back-button>
    </ion-buttons>
    <ion-title>Consultar Pagos</ion-title>
  </ion-toolbar>

</ion-header>

<ion-content [fullscreen]="true">
    <app-searchbar cssClass="form-field" placeholder="Buscar un estudiante" [value]="searchQuery"
      (valueChange)="onSearchInput($event)">
    </app-searchbar>
  <section>
    <div *ngIf="dataList.length > 0; else noPagos">
      <div class="list-card">
        <div class="list-item" *ngFor="let item of dataList" (click)="goToPaymentDetail(item)">
          <div class="avatar">{{ item.avatar }}</div>
          <div class="meta">
            <div class="title">{{ item.title }}</div>
            <div class="subtitle">{{ item.subtitle }} • {{ item.detail }}</div>
          </div>
          <div class="aside">
            <div class="amount-badge">{{ item.detail }}</div>
            <div class="status-pill" [ngClass]="item.statusClass">{{ item.statusLabel }}</div>
          </div>
        </div>
      </div>
    </div>
  </section>

  <ng-template #noPagos>
    <p class="muted" style="text-align:center;">No hay pagos registrados</p>
  </ng-template>
</ion-content>
