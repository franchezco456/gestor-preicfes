<ion-content id="home-content" [fullscreen]="true" class="form-page home-with-search">

  <ion-refresher slot="fixed" (ionRefresh)="handleRefresh($event)">
    <ion-refresher-content></ion-refresher-content>
  </ion-refresher>
  <div class="home-topbar">
    <div class="home-search-wrapper">
      <app-searchbar cssClass="form-field" placeholder="Buscar un estudiante" [value]="searchQuery"
        (valueChange)="onSearchInput($event)">
      </app-searchbar>

      <ion-list *ngIf="filteredResults.length" class="search-results">
        <ion-item *ngFor="let r of filteredResults" button (click)="selectSearchResult(r)">
          <ion-label>
            <h3>{{ r.name }} {{ r.lastname }}</h3>
            <p>ID: {{ r.id_student }}</p>
          </ion-label>
        </ion-item>
      </ion-list>
    </div>
  </div>
  <section class="dashboard-hero">
    <div class="hero-left">
      <div class="user-badge">
        <div class="user-info">
          <div class="user-name">Bienvenido {{ coordinatorName }}</div>
          <div class="user-sub muted">Mi cuenta</div>
        </div>
      </div>
    </div>
  </section>
  
  <section class="dashboard-grid" *ngIf="!loading">
    <ion-card class="stats-card">
      <ion-card-content>
        <div class="stats-grid">
          <div class="stat-cell">
            <div class="stat-value">{{ kpis[0]?.value }}</div>
            <div class="stat-label">{{ kpis[0]?.label }}</div>
          </div>
          <div class="stat-cell">
            <div class="stat-value">
              <ng-container *ngIf="kpis[1]?.value === 'COP 0'; else saldoValue">
                No tiene saldos pendientes
              </ng-container>
              <ng-template #saldoValue>{{ kpis[1]?.value }}</ng-template>
            </div>
            <div class="stat-label">{{ kpis[1]?.label }}</div>
          </div>
          <div class="stat-cell" (click)="gotoSearchPayments()" style="border: #008FFB solid 2px !important;">
            <div class="stat-value">{{ kpis[2]?.value }}</div>
            <div class="stat-label">{{ kpis[2]?.label }}</div>
          </div>
          <div class="stat-cell">
            <div class="stat-value">{{ kpis[3]?.value }}</div>
            <div class="stat-label">{{ kpis[3]?.label }}</div>
          </div>
        </div>
      </ion-card-content>
    </ion-card>
    <div class="chart-card">
      <app-card title="Estado de Pagos">
        <div style="margin-bottom: 1rem;">
          <app-select [label]="'Filtrar por'" [placeholder]="'Selecciona filtro'" [options]="[
              { value: 'dia', text: 'Día' },
              { value: 'mes', text: 'Mes' },
              { value: 'año', text: 'Año' }
            ]" [control]="filterControl" cssClass="filter-select" lines="none" interface="popover"></app-select>
        </div>
        <app-chart *ngIf="studentPagos" [chartOptions]="studentPagos" cssClass="home-chart"></app-chart>
      </app-card>
    </div>
  </section>


  <app-list [items]="dataList" (itemClick)="goToPaymentDetail($event)" *ngIf="!loading"></app-list>

  <app-fabbutom icon="menu" label="Acciones" color="primary" position="bottom-right" [actions]="[
      { id: 'estudiante', icon: 'person-add', label: 'Estudiante', color: 'secondary' },
      { id: 'pago', icon: 'card', label: 'Pago', color: 'secondary' },
      { id: 'logout', icon: 'log-out', label: 'Salir', color: 'secondary' }
    ]" (actionClick)="onFabAction($event)" *ngIf="!loading"></app-fabbutom>
</ion-content>
