<app-sidebar #sidebar menuId="homeMenu" contentId="home-content" side="start">

</app-sidebar>

<ion-content id="home-content" [fullscreen]="true" class="form-page home-with-search">
  <div class="home-topbar">
    <button class="menu-btn" (click)="toggleMenu()" aria-label="Abrir menú">
      <ion-icon name="menu"></ion-icon>
    </button>

    <div class="home-search-wrapper">
      <app-searchbar cssClass="form-field" placeholder="Buscar un estudiante" [value]="searchQuery"
        (valueChange)="onSearchInput($event)">
      </app-searchbar>

      <ion-list *ngIf="filteredResults.length" class="search-results">
        <ion-item *ngFor="let r of filteredResults" button (click)="selectSearchResult(r)">
          <ion-label>
            <h3>{{ r.Name }} {{ r.LastName }}</h3>
            <p>ID: {{ r.TI }}</p>
          </ion-label>
        </ion-item>
      </ion-list>
    </div>
  </div>

  <div>
    <ion-card>
      <app-chart [chartOptions]="studentPagos" cssClass="home-chart">
      </app-chart>
    </ion-card>
  </div>

  <app-list [items]="payments"></app-list>

  <app-fabbutom icon="menu" label="Acciones" color="primary" position="bottom-right" [actions]="[
      { id: 'estudiante', icon: 'person-add', label: 'Estudiante', color: 'secondary' },
      { id: 'pago', icon: 'card', label: 'Pago', color: 'secondary' },
      { id: 'logout', icon: 'log-out', label: 'Salir', color: 'secondary' }
    ]" (actionClick)="onFabAction($event)"></app-fabbutom>
</ion-content>
