<app-sidebar #sidebar menuId="homeMenu" contentId="home-content" side="start">

</app-sidebar>

<ion-content id="home-content" [fullscreen]="true" class="form-page home-with-search">
  <div class="home-topbar">
    <button class="menu-btn" (click)="toggleMenu()" aria-label="Abrir menú">
      <ion-icon name="menu"></ion-icon>
    </button>

    <div class="home-search-wrapper">
      <app-searchbar cssClass="form-field" placeholder="Buscar un estudiante" [value]="searchQuery"
        (valueChange)="onSearchInput($event)">
      </app-searchbar>

      <app-list
        *ngIf="filteredResults.length"
        [items]="filteredResults"
        titleField="Name"
        titleField2="LastName"
        subtitleField="id"
        cardTitle="Resultados de búsqueda"
        emptyText="No hay estudiantes encontrados"
        [showButton]="false"
        [showCardTitle]="false"
        (view)="selectSearchResult($event)"
        class="search-results"
      ></app-list>
    </div>
  </div>

  <section class="dashboard-hero">
    <div class="hero-left">
      <div class="user-badge">
        <div class="user-info">
          <div class="user-name">Bienvenido {{ coordinatorName }}</div>
          <div class="user-sub muted">Mi cuenta</div>
        </div>
      </div>
    </div>
  </section>

  <section class="dashboard-grid">
    <ion-card class="stats-card">
      <ion-card-content>
        <div class="stats-grid">
          <div class="stat-cell">
            <div class="stat-value">{{ kpis[0]?.value }}</div>
            <div class="stat-label">{{ kpis[0]?.label }}</div>
          </div>
          <div class="stat-cell">
            <div class="stat-value">
              <ng-container *ngIf="kpis[1]?.value === 'COP 0'; else saldoValue">
                No tiene saldos pendientes
              </ng-container>
              <ng-template #saldoValue>{{ kpis[1]?.value }}</ng-template>
            </div>
            <div class="stat-label">{{ kpis[1]?.label }}</div>
          </div>
          <div class="stat-cell">
            <div class="stat-value">{{ kpis[2]?.value }}</div>
            <div class="stat-label">{{ kpis[2]?.label }}</div>
          </div>
          <div class="stat-cell">
            <div class="stat-value">{{ kpis[3]?.value }}</div>
            <div class="stat-label">{{ kpis[3]?.label }}</div>
          </div>
        </div>
      </ion-card-content>
    </ion-card>
    <div class="chart-card">
      <app-card title="Estado de Pagos">
        <div style="margin-bottom: 1rem;">
          <app-select
            [label]="'Filtrar por'"
            [placeholder]="'Selecciona filtro'"
            [options]="[
              { value: 'dia', text: 'Día' },
              { value: 'mes', text: 'Mes' },
              { value: 'año', text: 'Año' }
            ]"
            [control]="filterControl"
            cssClass="filter-select"
            lines="none"
            interface="popover"
          ></app-select>
        </div>
        <app-chart *ngIf="studentPagos" [chartOptions]="studentPagos" cssClass="home-chart"></app-chart>
      </app-card>
    </div>
  </section>

  <section class="dashboard-bottom">
    <div class="recent-activity-header">
      <app-list
        [items]="payments"
        titleField="title"
        subtitleField="detail"
        cardTitle="Últimos pagos registrados"
        emptyText="No hay pagos registrados"
        (view)="goToStudentDetail($event)">
      </app-list>
    </div>
  </section>
  <app-fabbutom icon="menu" label="Acciones" color="primary" position="bottom-right" [actions]="[
      { id: 'estudiante', icon: 'person-add', label: 'Estudiante', color: 'secondary' },
      { id: 'pago', icon: 'card', label: 'Pago', color: 'secondary' },
      { id: 'logout', icon: 'log-out', label: 'Salir', color: 'secondary' }
    ]" (actionClick)="onFabAction($event)"></app-fabbutom>
</ion-content>
<app-bottom-tabbar [tabs]="tabButtons"></app-bottom-tabbar>
